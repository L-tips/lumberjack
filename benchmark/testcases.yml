# Reference configuration held fixed unless a bench varies it
_defaults:
  reference: &ref
    vote_fifo_depth: 4
    placement_strategy: execution-aware
    partition_strategy: equal-random

benches:
  # =========================================================================
  # iris
  # =========================================================================

  # --- cell sweep, reference strategies ---
  iris_1c_ss:   {<<: [*iris, *ref], num_cells: 1, use_superscalar: true}
  iris_1c_nss:  {<<: [*iris, *ref], num_cells: 1, use_superscalar: false}
  iris_2c_ss:   {<<: [*iris, *ref], num_cells: 2, use_superscalar: true}
  iris_2c_nss:  {<<: [*iris, *ref], num_cells: 2, use_superscalar: false}
  iris_4c_ss:   {<<: [*iris, *ref], num_cells: 4, use_superscalar: true}
  iris_4c_nss:  {<<: [*iris, *ref], num_cells: 4, use_superscalar: false}
  iris_6c_ss:   {<<: [*iris, *ref], num_cells: 6, use_superscalar: true}
  iris_6c_nss:  {<<: [*iris, *ref], num_cells: 6, use_superscalar: false}
  iris_7c_ss:   {<<: [*iris, *ref], num_cells: 7, use_superscalar: true}
  iris_7c_nss:  {<<: [*iris, *ref], num_cells: 7, use_superscalar: false}

  # --- placement cross @ 4c (partition fixed = equal-random) ---
  iris_4c_ss_dfs:     {<<: [*iris, *ref], num_cells: 4, use_superscalar: true,  placement_strategy: depth-first}
  iris_4c_nss_dfs:    {<<: [*iris, *ref], num_cells: 4, use_superscalar: false, placement_strategy: depth-first}
  iris_4c_ss_bfs:     {<<: [*iris, *ref], num_cells: 4, use_superscalar: true,  placement_strategy: breadth-first}
  iris_4c_nss_bfs:    {<<: [*iris, *ref], num_cells: 4, use_superscalar: false, placement_strategy: breadth-first}
  iris_4c_ss_random:  {<<: [*iris, *ref], num_cells: 4, use_superscalar: true,  placement_strategy: random}
  iris_4c_nss_random: {<<: [*iris, *ref], num_cells: 4, use_superscalar: false, placement_strategy: random}

  # --- partition cross @ 4c (placement fixed = execution-aware) ---
  iris_4c_ss_eqsorted:  {<<: [*iris, *ref], num_cells: 4, use_superscalar: true,  partition_strategy: equal-sorted}
  iris_4c_nss_eqsorted: {<<: [*iris, *ref], num_cells: 4, use_superscalar: false, partition_strategy: equal-sorted}
  iris_4c_ss_greedy:    {<<: [*iris, *ref], num_cells: 4, use_superscalar: true,  partition_strategy: greedy}
  iris_4c_nss_greedy:   {<<: [*iris, *ref], num_cells: 4, use_superscalar: false, partition_strategy: greedy}

  # --- placement cross @ 2c (partition fixed = equal-random) ---
  iris_2c_ss_dfs:     {<<: [*iris, *ref], num_cells: 2, use_superscalar: true,  placement_strategy: depth-first}
  iris_2c_nss_dfs:    {<<: [*iris, *ref], num_cells: 2, use_superscalar: false, placement_strategy: depth-first}
  iris_2c_ss_bfs:     {<<: [*iris, *ref], num_cells: 2, use_superscalar: true,  placement_strategy: breadth-first}
  iris_2c_nss_bfs:    {<<: [*iris, *ref], num_cells: 2, use_superscalar: false, placement_strategy: breadth-first}
  iris_2c_ss_random:  {<<: [*iris, *ref], num_cells: 2, use_superscalar: true,  placement_strategy: random}
  iris_2c_nss_random: {<<: [*iris, *ref], num_cells: 2, use_superscalar: false, placement_strategy: random}

  # --- partition cross @ 2c (placement fixed = execution-aware) ---
  iris_2c_ss_eqsorted:  {<<: [*iris, *ref], num_cells: 2, use_superscalar: true,  partition_strategy: equal-sorted}
  iris_2c_nss_eqsorted: {<<: [*iris, *ref], num_cells: 2, use_superscalar: false, partition_strategy: equal-sorted}
  iris_2c_ss_greedy:    {<<: [*iris, *ref], num_cells: 2, use_superscalar: true,  partition_strategy: greedy}
  iris_2c_nss_greedy:   {<<: [*iris, *ref], num_cells: 2, use_superscalar: false, partition_strategy: greedy}

  # --- placement cross @ 1c (partition is degenerate at 1 cell) ---
  iris_1c_ss_dfs:     {<<: [*iris, *ref], num_cells: 1, use_superscalar: true,  placement_strategy: depth-first}
  iris_1c_nss_dfs:    {<<: [*iris, *ref], num_cells: 1, use_superscalar: false, placement_strategy: depth-first}
  iris_1c_ss_bfs:     {<<: [*iris, *ref], num_cells: 1, use_superscalar: true,  placement_strategy: breadth-first}
  iris_1c_nss_bfs:    {<<: [*iris, *ref], num_cells: 1, use_superscalar: false, placement_strategy: breadth-first}
  iris_1c_ss_random:  {<<: [*iris, *ref], num_cells: 1, use_superscalar: true,  placement_strategy: random}
  iris_1c_nss_random: {<<: [*iris, *ref], num_cells: 1, use_superscalar: false, placement_strategy: random}

  # =========================================================================
  # skydive  (full placement x partition grid @ 4c
  # =========================================================================

  # --- cell sweep, reference strategies ---
  skydive_1c_ss:   {<<: [*skydive, *ref], num_cells: 1, use_superscalar: true}
  skydive_1c_nss:  {<<: [*skydive, *ref], num_cells: 1, use_superscalar: false}
  skydive_2c_ss:   {<<: [*skydive, *ref], num_cells: 2, use_superscalar: true}
  skydive_2c_nss:  {<<: [*skydive, *ref], num_cells: 2, use_superscalar: false}
  skydive_4c_ss:   {<<: [*skydive, *ref], num_cells: 4, use_superscalar: true}
  skydive_4c_nss:  {<<: [*skydive, *ref], num_cells: 4, use_superscalar: false}
