  skydive_4c_nss_random_eqrandom: {<<: [*skydive, *ref], num_cells: 4, use_superscalar: false, placement_strategy: random, partition_strategy: equal-random}
  skydive_4c_ss_random_eqsorted:  {<<: [*skydive, *ref], num_cells: 4, use_superscalar: true,  placement_strategy: random, partition_strategy: equal-sorted}
  skydive_4c_nss_random_eqsorted: {<<: [*skydive, *ref], num_cells: 4, use_superscalar: false, placement_strategy: random, partition_strategy: equal-sorted}
  skydive_4c_ss_random_greedy:    {<<: [*skydive, *ref], num_cells: 4, use_superscalar: true,  placement_strategy: random, partition_strategy: greedy}
  skydive_4c_nss_random_greedy:   {<<: [*skydive, *ref], num_cells: 4, use_superscalar: false, placement_strategy: random, partition_strategy: greedy}

  # --- placement cross @ 2c (partition fixed = equal-random) ---
  skydive_2c_ss_dfs:     {<<: [*skydive, *ref], num_cells: 2, use_superscalar: true,  placement_strategy: depth-first}
